[project]
name = "tarif-rehberi"
version = "0.1.0"
description = "YAZLAB-I Tarif Rehberi Uygulamasi"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.9.0",
    "pytest>=9.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
